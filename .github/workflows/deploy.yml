on:
  workflow_call:
    inputs:
     app_name:
        required: true
        type: string
     app_env:
        required: true
        type: string
jobs:
 docker-build-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 'satyamdevops09/roboshop-helm'
          path: 'helm'
      
      - name: Deploy
        run: |
          cd helm
          aws eks update-kubeconfig --name dev --region us-east-1
          helm upgrade -i ${{ inputs.app_name }} . -f env-${{ inputs.app_env }}/${{ inputs.app_name }}.yml 

 